[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stagewise-source-binding"
version = "0.2.0"
description = "Stagewise instruction source binding across Base, SFT, DPO, and RLVR checkpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.2",
  "huggingface-hub>=0.27",
]

[project.urls]
Repository = "https://github.com/rajarshighoshal/stagewise-source-binding"

[project.optional-dependencies]
gpu = [
  "accelerate>=1.2",
  "safetensors>=0.4",
  "torch>=2.5",
  "tqdm>=4.67",
  "transformers>=4.48",
]

[project.scripts]
frame-stage-run = "frame_stage_binding.repair_run:main"
frame-stage-analyze = "frame_stage_binding.repair_analyze:main"
frame-stage-lock = "frame_stage_binding.repair_lock:main"

[tool.setuptools.packages.find]
include = ["frame_stage_binding*"]
